<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ubay Snack</title>
  
  <!-- Koneksi ke Manifest & Ikon Baru -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <meta name="theme-color" content="#059669">
  
  <!-- Mode Fullscreen Android Tanpa Bar Browser -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <!-- GANTI DENGAN URL /exec DARI GOOGLE APPS SCRIPT ANDA -->
  <iframe  
    src="https://script.google.com/macros/s/AKfycbyFhVOvS2VPkXSl3OlIGx-Nx6zfheBhfA_ImQQ7vfA-9r3Em9IuTaqXHp-6TgaFSpyg/exec" 
    allow="clipboard-write; camera; geolocation">
  </iframe>

  <!-- Registrasi Service Worker Agar Tombol Install Muncul di Android -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('PWA ServiceWorker Aktif!'))
          .catch(err => console.log('SW Gagal:', err));
      });
    }
  </script>
</body>
</html>

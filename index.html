<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Toko Online</title>
  
  <!-- Manifest & Meta PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#059669">
  <link rel="icon" type="image/png" sizes="192x192" href="icon_192.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Pengaturan Layar Penuh Android -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <!-- GANTI DENGAN URL /exec DARI GOOGLE APPS SCRIPT ANDA -->
  <iframe 
    src="https://script.google.com/macros/s/AKfycbzBaLHZbkkF5mB2of0j4YrTDIpTRHzRZDAGnaXdsaewJ6ONu6LjRGKqyTxg-y_AGYoJ/exec" 
    allow="clipboard-write; camera; geolocation; payment">
  </iframe>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('ServiceWorker PWA Aktif!'))
          .catch(err => console.error('PWA Error:', err));
      });
    }
  </script>
</body>
</html>
